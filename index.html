<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>epik games to play</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #333333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Top Title Styling */
        .brand-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .brand-header h1 {
            font-size: 3.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            color: #111;
            font-weight: 900;
        }

        .brand-header p {
            color: #555;
            font-size: 1.3rem;
            margin-top: 8px;
            font-style: italic;
            font-weight: 600;
        }

        /* Responsive 3-Column Grid matching the picture */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            max-width: 1100px;
            width: 100%;
            flex-grow: 1;
        }

        /* Individual Interactive Project Cards */
        .game-card {
            background: #f8f9fa;
            border: 3px solid #111111;
            border-radius: 16px;
            height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #111111;
            font-size: 1.8rem;
            font-weight: bold;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0px 0px #111;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        /* Hover Pop-out Effects */
        .game-card:hover {
            transform: translate(-4px, -4px);
            box-shadow: 6px 6px 0px #111111;
        }

        /* Distinctive Card Theme Customizations */
        .card-cookie {
            background: linear-gradient(135deg, #e67e22, #f39c12);
            color: white;
        }

        .card-coming-soon {
            background: #f1f2f6;
            color: #a4b0be;
            border: 3px dashed #ced6e0;
            cursor: default;
        }
        .card-coming-soon:hover {
            transform: none;
            box-shadow: none;
        }

        /* Footer Credits Styling */
        .footer-credits {
            text-align: center;
            margin-top: 60px;
            padding: 20px 0;
            font-size: 1rem;
            color: #777;
            width: 100%;
            border-top: 1px solid #eee;
        }

        /* Mobile Optimization */
        @media (max-width: 900px) {
            .game-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 600px) {
            .game-grid {
                grid-template-columns: 1fr;
            }
            .brand-header h1 { font-size: 2.2rem; }
            .brand-header p { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <!-- Header Block -->
    <div class="brand-header">
        <h1>epik games to play</h1>
        <p>made by nigel the goat</p>
    </div>

    <!-- Arcade Showcase Grid -->
    <div class="game-grid">

        <!-- Card 1: Your Live Cookie Game Link -->
        <a href="cookie.html" class="game-card card-cookie">
            🍪 Cookie Clicker
        </a>

        <!-- Card 2: Placeholder for your next creation -->
        <div class="game-card card-coming-soon">
            ❓ Mystery Game 2
        </div>

        <!-- Card 3: Placeholder for your next creation -->
        <div class="game-card card-coming-soon">
            ❓ Mystery Game 3
        </div>

    </div>

    <!-- Footer Credits -->
    <div class="footer-credits">
        inspired by neal.fun
    </div>

</body>
</html>
