<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Clicker Mania</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .score-container {
            font-size: 2rem;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 30px;
            border-radius: 50px;
            margin-bottom: 30px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }

        .cookie-wrapper {
            position: relative;
            margin-bottom: 40px;
        }

        .cookie {
            font-size: 120px;
            cursor: pointer;
            transition: transform 0.05s ease;
            display: inline-block;
            filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.4));
        }

        .cookie:active {
            transform: scale(0.9);
        }

        .upgrade-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 300px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .upgrade-btn {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            transition: background 0.2s, transform 0.1s;
        }

        .upgrade-btn:hover {
            background-color: #d35400;
        }

        .upgrade-btn:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
            transform: none;
        }

        .floating-text {
            position: absolute;
            color: #f1c40f;
            font-size: 1.5rem;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-100px); }
        }
    </style>
</head>
<body>

    <h1>Cookie Clicker</h1>
    <div class="score-container"><span id="score">0</span> Cookies</div>

    <div class="cookie-wrapper" id="cookie-area">
        <div class="cookie" id="cookie-btn">🍪</div>
    </div>

    <div class="upgrade-box">
        <h3>Upgrades</h3>
        <p>Auto-Clickers: <span id="auto-count">0</span></p>
        <button class="upgrade-btn" id="upgrade-btn" disabled>Buy Auto-Clicker (Cost: 15)</button>
        <p style="font-size: 0.85rem; color: #bdc3c7; margin-top: 8px;">Adds +1 cookie per second</p>
    </div>

    <script>
        let score = 0;
        let autoClickers = 0;
        let upgradeCost = 15;

        const scoreDisplay = document.getElementById('score');
        const cookieBtn = document.getElementById('cookie-btn');
        const cookieArea = document.getElementById('cookie-area');
        const upgradeBtn = document.getElementById('upgrade-btn');
        const autoCountDisplay = document.getElementById('auto-count');

        // Click the Cookie
        cookieBtn.addEventListener('click', (e) => {
            score++;
            updateDisplay();
            createFloatingText(e);
        });

        // Buy Upgrade
        upgradeBtn.addEventListener('click', () => {
            if (score >= upgradeCost) {
                score -= upgradeCost;
                autoClickers++;
                upgradeCost = Math.round(upgradeCost * 1.5); // Increase cost for next one
                updateDisplay();
            }
        });

        // Game Loop (Runs every second for Auto-Clickers)
        setInterval(() => {
            if (autoClickers > 0) {
                score += autoClickers;
                updateDisplay();
            }
        }, 1000);

        function updateDisplay() {
            scoreDisplay.textContent = score;
            autoCountDisplay.textContent = autoClickers;
            upgradeBtn.textContent = `Buy Auto-Clicker (Cost: ${upgradeCost})`;
            
            // Check if player can afford upgrade
            if (score >= upgradeCost) {
                upgradeBtn.disabled = false;
            } else {
                upgradeBtn.disabled = true;
            }
        }

        function createFloatingText(e) {
            const text = document.createElement('div');
            text.classList.add('floating-text');
            text.textContent = '+1';
            
            // Center the text roughly around the click location
            text.style.left = `50%`;
            text.style.top = `20px`;
            
            cookieArea.appendChild(text);
            
            // Remove text after animation finishes
            setTimeout(() => {
                text.remove();
            }, 800);
        }
    </script>
</body>
</html>
