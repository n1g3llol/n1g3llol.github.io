<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Fun Arcade</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #333333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Title Styling */
        .brand-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .brand-header h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            color: #111;
        }

        .brand-header p {
            color: #666;
            font-size: 1.1rem;
            margin-top: 5px;
        }

        /* Responsive 3-Column Grid matching the picture */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            max-width: 1100px;
            width: 100%;
        }

        /* Individual Interactive Project Cards */
        .game-card {
            background: #f8f9fa;
            border: 3px solid #111111;
            border-radius: 16px;
            height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #111111;
            font-size: 1.8rem;
            font-weight: bold;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0px 0px #111;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        /* Hover Pop-out Effects */
        .game-card:hover {
            transform: translate(-4px, -4px);
            box-shadow: 6px 6px 0px #111111;
        }

        /* Distinctive Card Theme Customizations */
        .card-cookie {
            background: linear-gradient(135deg, #e67e22, #f39c12);
            color: white;
        }

        .card-coming-soon {
            background: #f1f2f6;
            color: #a4b0be;
            border: 3px dashed #ced6e0;
            cursor: default;
        }
        .card-coming-soon:hover {
            transform: none;
            box-shadow: none;
        }

        /* Mobile Optimization */
        @media (max-width: 900px) {
            .game-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 600px) {
            .game-grid {
                grid-template-columns: 1fr;
            }
            .brand-header h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <!-- Header Block -->
    <div class="brand-header">
        <h1>MY ARCADE</h1>
        <p>games and stuff by me</p>
    </div>

    <!-- Arcade Showcase Grid -->
    <div class="game-grid">

        <!-- Card 1: Your Live Cookie Game Link -->
        <a href="cookie.html" class="game-card card-cookie">
            🍪 Cookie Clicker
        </a>

        <!-- Card 2: Placeholder for your next creation -->
        <div class="game-card card-coming-soon">
            ❓ Mystery Game 2
        </div>

        <!-- Card 3: Placeholder for your next creation -->
        <div class="game-card card-coming-soon">
            ❓ Mystery Game 3
        </div>

    </div>

</body>
</html>
